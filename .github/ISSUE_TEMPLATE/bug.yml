name: Bug report
description: Something in the app does not work or looks wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The screen or lesson (for example "Lesson 1.3, the lock toy") and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example "Pixel 8, Chrome 130" or "iPhone 15, Safari".
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the About section of the You tab.
